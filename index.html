<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>카운터</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            background-color: white;
        }
        .container {
            text-align: center;
        }
        #count {
            font-size: 48px;
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>카운터</h1>
        <div id="count">0</div>

        <button onclick="decrease()">- 1</button>
        <button onclick="reset()">Reset</button>
        <button onclick="increase()">+ 1</button>
    </div>

    <script>
        let count = 0;

        function updateDisplay() {
            const countElement = document.getElementById('count');
            countElement.innerText = count;
        }

        function increase() {
            count++;
            updateDisplay();
        }

        function decrease() {
            count--;
            updateDisplay();
        }

        function reset() {
            count = 0;
            updateDisplay();
        }
    </script>

</body>
</html>
