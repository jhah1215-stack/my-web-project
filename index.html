<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>JavaScript 실습 과제</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
        }
        .container {
            text-align: center;
            border: 1px solid #ccc;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
        }
        h1 { 
            font-size: 24px;
            color: #333;
        }
        p { 
            color: #666; 
        }
        button {
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
            background-color: #eee;
            border: 1px solid #999;
            border-radius: 4px;
        }
        button:hover {
            background-color: #ddd;
        }
        #message {
            margin-top: 20px;
            font-size: 18px;
            color: #000;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>JavaScript 실습</h1>
        <p>버튼을 누르면 메시지가 출력됩니다.</p>
        <button onclick="runAction()">실행하기</button>
        <div id="message"></div>
    </div>

    <script>
        function runAction() {

            const msg = document.getElementById('message');
            
        
            msg.innerText = "정상적으로 실행되었습니다.";
            
            document.body.style.backgroundColor = "#f8f9fa";
        }
    </script>

</body>
</html>
